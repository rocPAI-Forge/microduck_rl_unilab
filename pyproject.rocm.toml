[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "microduck-rl-unilab"
version = "0.1.0"
description = "Pollen Robotics MicroDuck RL training built on the UniLab package distribution"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "UniLab" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    # UniLab 1.0.0 on PyPI includes the in-repo microduck removal
    # (Motphys/UniLab#1495), the read_reset_root_pose base API (#1494) and
    # the unilab-rl==1.0.0 pin (#1496).
    "unilab[mujoco]==1.0.0",
    "unilab-rl==1.0.0",
    # MuJoCo and Motrix backends, including BAM substep torque, come from
    # unisim-core 1.0.0.
    "unisim-core==1.0.0",
    # unilab==1.0.0 requires torch<2.12, so this profile cannot take the
    # upstream UniLab 1.3.5 ROCm pin (torch==2.14.0, triton-rocm==3.8.0).
    # 2.11.0+rocm7.2 is the build already run on the RX 9070 XT.
    "torch==2.11.0",
    "triton-rocm==3.6.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "huggingface_hub>=0.25",
]

[project.scripts]
microduck-train = "microduck_rl_unilab.cli:train_main"
microduck-eval = "microduck_rl_unilab.cli:eval_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
triton-rocm = [
    { index = "pytorch-rocm72", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[tool.uv]
exclude-dependencies = [
    "torchvision",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# mujoco-uni-runtime records the build-time mujoco version in its native
# extension; always compile it from the sdist against the resolved mujoco
# (same rationale as UniLab's own pyproject.toml).
no-build-isolation-package = ["mujoco-uni-runtime"]
no-binary-package = ["mujoco-uni-runtime"]

[tool.pytest.ini_options]
markers = [
    "slow: marks slow tests (real backend env builds, asset downloads)",
]
