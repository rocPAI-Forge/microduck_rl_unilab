# @package _global_
# Scoot round 4: friction that takes effect, on the parts that touch, plus mirror loss.
#
# Round 3 (4096 envs) still sat still at backward commands and paddled with
# one leg. Replaying its poses showed the trunk never reaches the floor: the
# duck rests on its shins and feet. And the floor's 1.0 friction wins MuJoCo's
# max-combination, so the slippery seat curriculum never happened and the
# shins always gripped at 1.0. Here:
#   - the _prio scene gives robot collision geoms contact priority 1, so their
#     own (randomized) friction governs floor contacts;
#   - the slippery-to-normal friction curriculum covers the shins too; the feet
#     keep the inherited 0.7-1.3 foot friction, now effective below 1.0;
#   - the velocity tasks' mirror loss pairs each leg's stroke with the other's.
defaults:
  - /task/microduck_scoot_straight_flat/mujoco
  - _self_

algo:
  experiment_name: microduck_scoot_sym
  run_name: microduck_scoot_sym
  algorithm:
    symmetry_cfg:
      use_data_augmentation: false
      use_mirror_loss: true
      mirror_loss_coeff: 0.5
      data_augmentation_func: microduck_rl_unilab.tasks.microduck.symmetry.microduck_velocity_symmetry

env:
  scene:
    model_file: assets/robots/microduck/generated/scene_flat_groundcontact_bam_hull_prio.xml
    entities:
      robot:
        geom_names:
          - left_foot_collision
          - right_foot_collision
          - left_leg_self_collision
          - right_leg_self_collision
          - np_f970_collision
          - left_hip_collision
          - right_hip_collision
          - top_head_shell_collision
          - jaw_collision
          - bottom_head_shell_collision
  events:
    seat_friction:
      params:
        asset_cfg:
          geom_names:
            - left_leg_self_collision
            - right_leg_self_collision
            - np_f970_collision
            - left_hip_collision
            - right_hip_collision
            - top_head_shell_collision
            - jaw_collision
            - bottom_head_shell_collision
