# @package _global_
# Basketball round 4: tighter speed/yaw tracking on top of round 3.
#
# Round 3 (model_9497) keeps a free ball balanced (99.5% at 60 s) but ignores
# the command: body vx stays near +0.05 to +0.07 m/s whatever is commanded, and
# yaw error stays near 0.55 rad/s. The base tracking kernels are too loose at
# these speeds: exp(-err^2/std^2) with std 0.32 m/s gives a motionless duck
# about 0.8 of the reward at a 0.15 m/s command. Here:
#   - linear kernel std 0.1 m/s (was 0.316), weight 4.0 (was 2.5);
#   - yaw kernel std 0.3 rad/s (was 0.707), weight 2.0 (was 1.25).
# Commands, hold levels, pushes and the rest are inherited from round 3.
# Warm start from round 3 model_9497; max_iterations is the number of
# additional iterations (500 gives 9497 -> ~9997).
defaults:
  - /task/microduck_basketball_ft2_flat/mujoco
  - _self_

algo:
  experiment_name: microduck_basketball_ft3
  run_name: microduck_basketball_ft3

reward:
  tracking_lin_vel:
    weight: 4.0
    params: {std: 0.1, command_name: twist}
  tracking_ang_vel:
    weight: 2.0
    params: {std: 0.3, command_name: twist}
