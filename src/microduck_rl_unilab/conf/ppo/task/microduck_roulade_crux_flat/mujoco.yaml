# @package _global_
# Roulade round 2: close the push-up escape and practice the crux.
#
# Round 1 (microduck_roulade_flat, model_17998, warm start from standup)
# learned the second half (from 140-180 deg it completes and stands 94.5%,
# from 180-260 deg 100%) but never from standing: it face-plants, lies prone
# at ~147 deg with the legs up, falls back and does standup's prone push-up.
# Progress only pays new maxima, so that retreat was free. Here (not upstream):
#   - roulade_regress_penalty, weight -1.0: (max - accum) while the maximum
#     is between 30 and 260 deg;
#   - roulade_stall_penalty, weight -0.5: per step in that window, so lying at
#     the maximum is not free either;
#   - mid-roll spawns at 80-260 deg (the crux and after), always with 1-3.5
#     rad/s of forward spin; standing and mid-roll stay 50/50 (no spawn-mix
#     curriculum).
# Warm start from round 1; max_iterations counts additional iterations.
defaults:
  - /task/microduck_roulade_flat/mujoco
  - _self_

algo:
  max_iterations: 1500
  experiment_name: microduck_roulade_crux
  run_name: microduck_roulade_crux

env:
  events:
    reset_roulade:
      params:
        midroll_pitch_min: 1.3962634015954636
        midroll_pitch_max: 4.537856055185257
        midroll_omega_range: [1.0, 3.5]
  curriculum:
    roulade_spawn_mix: null

reward:
  roulade_regress:
    func: microduck_rl_unilab.tasks.microduck.roulade_terms.roulade_regress_penalty
    weight: -1.0
  roulade_stall:
    func: microduck_rl_unilab.tasks.microduck.roulade_terms.roulade_stall_penalty
    weight: -0.5
