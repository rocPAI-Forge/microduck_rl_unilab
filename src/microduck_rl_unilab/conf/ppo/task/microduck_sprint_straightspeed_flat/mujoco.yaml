# @package _global_
defaults:
  - /task/microduck_sprint_straightspeed_flat/base
  - _self_

training:
  task_name: MicroduckSprintFlat
  sim_backend: mujoco
  play_steps: 1000

algo:
  num_envs: 2048
  max_iterations: 3000
  save_interval: 250
  empirical_normalization: true
  obs_groups:
    actor: [policy]
    critic: [critic]
  policy:
    init_noise_std: 1.0
  algorithm:
    # Resume rate. The straight gait is the starting point.
    learning_rate: 1.0e-4
    entropy_coef: 0.005
